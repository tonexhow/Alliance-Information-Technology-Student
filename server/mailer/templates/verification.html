{{define "verification.html"}}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="supported-color-schemes" content="light dark">
  <title>{{.Title}}</title>
  <style>
    :root{color-scheme:light dark;supported-color-schemes:light dark}
    body{margin:0;padding:0;background:#f5f2ed;color:#201d1a;font-family:Arial,Helvetica,sans-serif;-webkit-text-size-adjust:100%}.preheader{display:none!important;max-height:0;max-width:0;overflow:hidden;opacity:0;color:transparent}.page{width:100%;border-collapse:collapse;background:#f5f2ed}.outer{padding:0}.card{width:100%;max-width:620px;border-collapse:separate;border-spacing:0;background:#fff}.brand{padding:20px;background:linear-gradient(135deg,#751f18,#9b5d09);color:#fff}.brand-name{font-size:22px;line-height:1.15;font-weight:800}.brand-sub{margin-top:4px;font-size:13px;color:#f5ded8}.content{padding:20px}.content h1{margin:0 0 14px;font-size:23px;line-height:1.2;color:#201d1a}.content p{margin:0 0 16px;color:#625a53;font-size:15px;line-height:1.65}.code{margin:20px 0;padding:18px 12px;border:1px dashed #c6b7a9;border-radius:12px;background:#fbf8f4;color:#751f18;text-align:center;font:800 28px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:5px;word-break:break-all}.footer{padding:16px 20px;border-top:1px solid #eee6dd;color:#766d65;font-size:12px;line-height:1.55}@media(min-width:560px){.outer{padding:28px 16px}.card{border:1px solid #e6ded4;border-radius:18px;overflow:hidden}.brand{padding:24px 26px}.content{padding:26px}.footer{padding:17px 26px}.code{font-size:30px;letter-spacing:7px}}@media(prefers-color-scheme:dark){body,.page{background:#111214!important;color:#eee8df!important}.card{background:#1a1c1f!important;border-color:#303237!important}.brand{background:linear-gradient(135deg,#49201d,#6c4712)!important}.brand-sub{color:#e8c9c3!important}.content h1{color:#eee8df!important}.content p,.footer{color:#aaa39a!important}.code{background:#111214!important;border-color:#51483f!important;color:#ffc554!important}.footer{border-color:#303237!important}}
  </style>
</head>
<body>
  {{if .Preheader}}<div class="preheader">{{.Preheader}}</div>{{end}}
  <table role="presentation" class="page" width="100%"><tr><td class="outer" align="center"><table role="presentation" class="card" width="100%">
    <tr><td class="brand"><div class="brand-name">AITS</div><div class="brand-sub">Account verification</div></td></tr>
    <tr><td class="content"><h1>{{.Title}}</h1>{{if .Greeting}}<p>Hello {{.Greeting}},</p>{{end}}<p>{{.Message}}</p><div class="code">{{.Code}}</div></td></tr>
    <tr><td class="footer">{{.Footer}}</td></tr>
  </table></td></tr></table>
</body>
</html>{{end}}
