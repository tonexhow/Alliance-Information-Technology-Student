<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>AITS · Offline</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light dark}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#0f1115;color:#f4f6f8}
    main{width:min(440px,100%);padding:28px;border:1px solid #303641;border-radius:24px;background:#171a20;box-shadow:0 24px 70px rgba(0,0,0,.32);text-align:center}
    .mark{width:72px;height:72px;margin:auto;display:grid;place-items:center;border-radius:18px;background:#f47c20;color:white;font-size:28px;font-weight:900}h1{margin:18px 0 8px;font-size:24px}p{margin:0;color:#aeb6c3;font-size:14px;line-height:1.65}
    button{margin-top:20px;min-height:44px;padding:0 18px;border:0;border-radius:12px;background:#f47c20;color:white;font-weight:800;cursor:pointer}
    small{display:block;margin-top:14px;color:#7f8998;line-height:1.45}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">A</div>
    <h1>AITS is offline</h1>
    <p>The server cannot be reached right now. Reconnect to the internet and AITS will continue from your saved device state.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>After a successful app load, supported member data and queued actions are kept on-device for offline use.</small>
  </main>
</body>
</html>
